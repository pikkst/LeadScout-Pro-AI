name: LeadScout Supabase Prisma bootstrap (retired)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY to run pending Prisma migrations against the configured database'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: leadscout-supabase-prisma-migrations
  cancel-in-progress: false

jobs:
  migrate:
    # Supabase was replaced by Neon. Keep the old workflow as an audit trail,
    # but prohibit new accidental writes to the former database.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: leadscout-database
    env:
      DATABASE_URL: ${{ secrets.LEADSCOUT_SUPABASE_DIRECT_URL }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify migration secret exists
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::LEADSCOUT_SUPABASE_DIRECT_URL is not configured"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply tracked Prisma migrations
        run: npx prisma migrate deploy
      - name: Verify Prisma migration state
        run: npx prisma migrate status
      - name: Verify LeadScout Data API access is denied
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/db/verify-leadscout-isolation.sql
